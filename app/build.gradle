plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'in.atulpatare.ranobem'
    compileSdk 36

    defaultConfig {
        applicationId "in.atulpatare.ranobem"
        minSdk 24
        targetSdk 36
        versionCode 16
        versionName "16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // the app is only translated to these, so drop the other ~90 languages libraries bring along
    androidResources {
        localeFilters += ["en", "ru"]
    }

    packaging {
        resources {
            // license texts and Kotlin metadata, nothing reads them at runtime
            excludes += ["META-INF/**/LICENSE.txt", "META-INF/*.version", "META-INF/*.kotlin_module",
                         "kotlin/**", "DebugProbesKt.bin"]
        }
    }

    signingConfigs {
        // populated by CI (.github/workflows/release.yml); local release builds stay unsigned
        if (System.getenv("KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(path: ':core')
    implementation libs.glide
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.touchimageview
    implementation libs.okhttp
    // periodic new chapter checks for the library
    implementation libs.androidx.work.runtime

    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    // reports leaked activities and fragments in debug builds
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
}