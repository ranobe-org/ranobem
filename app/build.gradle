plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'in.atulpatare.ranobem'
    compileSdk 36

    defaultConfig {
        applicationId "in.atulpatare.ranobem"
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName "15"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    flavorDimensions "version"
    productFlavors {
        free {
            dimension "version"
            buildConfigField "boolean", "IS_PRO", "false"
        }
        pro {
            dimension "version"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"

            buildConfigField "boolean", "IS_PRO", "true"
        }
    }

    // the app is only translated to these, so drop the other ~90 languages libraries bring along
    androidResources {
        localeFilters += ["en", "ru"]
    }

    packaging {
        resources {
            // license texts and Kotlin metadata, nothing reads them at runtime
            excludes += ["META-INF/**/LICENSE.txt", "META-INF/*.version", "META-INF/*.kotlin_module",
                         "kotlin/**", "DebugProbesKt.bin"]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(path: ':core')
    implementation libs.glide
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.touchimageview
    implementation libs.okhttp
    // periodic new chapter checks for the library
    implementation libs.androidx.work.runtime

    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
}